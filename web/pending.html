<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待我处理 - 工单系统</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <div class="card">
      <h2 class="card-title">待我处理的工单</h2>
      <div class="filter-bar">
        <input class="form-control search" id="search" placeholder="搜索编号/标题/提交人" />
        <select class="form-control" id="urgency">
          <option value="">全部紧急</option>
          <option value="normal">普通</option>
          <option value="urgent">紧急</option>
        </select>
        <button class="btn" id="searchBtn">查询</button>
      </div>
      <div id="listWrap"></div>
    </div>
  </div>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/pages/pending.js"></script>
</body>
</html>
