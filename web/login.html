<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 工单系统</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container" style="max-width:400px; margin-top:60px;">
    <div class="card">
      <h2 class="card-title">登录</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>用户名</label>
          <input class="form-control" name="username" required placeholder="用户名" />
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="form-control" type="password" name="password" required placeholder="密码" />
        </div>
        <button class="btn" type="submit" style="width:100%;">登录</button>
      </form>
      <p style="margin-top:16px; text-align:center; font-size:14px; color:var(--muted);">
        没有账号？<a href="/register">注册</a>
      </p>
      <p style="margin-top:8px; text-align:center; font-size:12px; color:var(--muted);">
        默认管理员 admin / 123456
      </p>
    </div>
  </div>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/pages/login.js"></script>
</body>
</html>
